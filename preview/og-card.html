<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Newsreader";
        src: url("/fonts/newsreader.woff2") format("woff2");
        font-weight: 300 600;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Newsreader";
        src: url("/fonts/newsreader-italic.woff2") format("woff2");
        font-weight: 300 600;
        font-style: italic;
        font-display: block;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url("/fonts/instrument-sans.woff2") format("woff2");
        font-weight: 400 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("/fonts/ibm-plex-mono-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f5f1e8;
        color: #2b2721;
        font-family: "Instrument Sans", system-ui, sans-serif;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 56px 72px 52px;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(900px 520px at 92% -12%, #e9f0e6 0%, rgba(233, 240, 230, 0) 62%),
          radial-gradient(700px 420px at -8% 108%, #efe9da 0%, rgba(239, 233, 218, 0) 58%),
          #f5f1e8;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(43, 39, 33, 0.035) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(43, 39, 33, 0.035) 1px, transparent 1px);
        background-size: 120px 120px;
        mask-image: radial-gradient(120% 90% at 50% 40%, #000 30%, transparent 82%);
      }

      header {
        display: flex;
        align-items: center;
        gap: 14px;
        position: relative;
      }

      .word {
        font-family: "Newsreader", serif;
        font-size: 30px;
        letter-spacing: -0.02em;
        color: #241f19;
      }

      h1 {
        margin-top: 78px;
        font-family: "Newsreader", serif;
        font-weight: 400;
        font-size: 80px;
        line-height: 1.03;
        letter-spacing: -0.028em;
        color: #241f19;
        position: relative;
      }

      h1 em {
        font-style: italic;
        color: #2f6b4f;
      }

      p {
        margin-top: 26px;
        max-width: 665px;
        font-size: 24px;
        line-height: 1.44;
        color: #6b6459;
        position: relative;
      }

      footer {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
        padding-top: 26px;
        border-top: 1px solid rgba(43, 39, 33, 0.14);
      }

      .domain {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #7a7264;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 9px 15px 9px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(176, 47, 40, 0.22);
        box-shadow: 0 6px 18px -10px rgba(43, 39, 33, 0.4);
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #b0342a;
        box-shadow: 0 0 0 4px rgba(176, 52, 42, 0.14);
      }

      .chip span {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #7c2a22;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="grid"></div>

      <header>
        <svg width="44" height="44" viewBox="0 0 96 96" aria-hidden="true">
          <rect width="96" height="96" rx="22" fill="#2f6b4f" />
          <g fill="#f7f3ea">
            <rect x="20" y="42" width="8" height="12" rx="4" />
            <rect x="32" y="28" width="8" height="40" rx="4" />
            <rect x="44" y="44" width="8" height="8" rx="4" />
            <rect x="56" y="28" width="8" height="40" rx="4" />
            <rect x="68" y="42" width="8" height="12" rx="4" />
          </g>
        </svg>
        <span class="word">Azanchi</span>
      </header>

      <h1>Meeting notes that<br />write <em>themselves</em>.</h1>

      <p>
        Live notes while people talk. The follow-up before the call ends.
        No bot joins the meeting.
      </p>

      <footer>
        <span class="domain">azanchi.com</span>
        <span class="chip"><i class="dot"></i><span>Rec · 12:47</span></span>
      </footer>
    </div>
  </body>
</html>
