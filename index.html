    <script type="application/ld+json">
      {

        "name": "Azanchi",

        ]

    </script>
    <script>
      // Resolve the theme before paint so the page never flashes the wrong paper.
      (function () {
        try {
          var param = new URLSearchParams(window.location.search).get("theme");
          var saved = localStorage.getItem("azanchi.theme");
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = param === "light" || param === "dark" ? param : saved || (dark ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          if ("IntersectionObserver" in window) {
            document.documentElement.classList.add("reveal-ready");
          }
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
